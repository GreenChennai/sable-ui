# cargo-deny 配置(GATE-08 许可自动审计;分册十二 G-6)。
# CI:EmbarkStudios/cargo-deny-action@v2,`cargo deny check licenses bans`。
# 注:本地未装 cargo-deny,本文件首推后由 CI 首跑验证(见 docs/12 门禁清单)。

[licenses]
version = 2
# 允许的许可(报告 GATE-08 指定清单;SPDX 全称)。
# 红线:任何 GPL/LGPL/AGPL 族不在此列 → CI 红。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "MPL-2.0-or-later",
    "NCSA",
]
# 依据(2026-10-04 全 lock 树实测预演):adler2/enum-iterator=0BSD,
# aho-corasick/memchr/byteorder 等=Unlicense OR MIT,dwrote/zvariant/smartstring
# =MPL-2.0(wgpu/directx 与 gpui Linux 栈),libfuzzer-sys=NCSA,
# wit-bindgen 族=Apache-2.0 WITH LLVM-exception。红线 GPL/LGPL/AGPL 仍不在列。

[bans]
# 重复依赖暂只告警(wgpu/gpui 生态常见多版本),不阻塞;积累后再逐个收敛。
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
