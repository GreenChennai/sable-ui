[package]
name = "video_editor"
description = "迷你剪映示例:轨道时间轴 + 播放监视器 + 关键帧曲线(上游:CutForge apps/desktop 的原型)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sable = { path = "../../crates/sable" }
# PERF-11 收口:RGBA→RenderImage 桥统一走 sable-canvas::gpui_element 单点
# (png feature 引入 image,无 PNG 编码步骤;豁免因由见 crates/sable-canvas/Cargo.toml)。
sable-canvas = { path = "../../crates/sable-canvas", features = ["gpui", "cpu", "png"] }
