[package]
name = "lumina-widgets"
description = "L5 专用组件层:设计 token、主题、动画引擎、NumberField/色轮/图层面板/属性检查器/时间轴视图"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 组件级 feature(分册六 §2.2/§2.3):小软件按需点菜,不想要的组件不进编译产物
[features]
default = ["full"]
full = ["theme", "anim", "binding", "color", "number-field", "inspector", "layer-panel", "timeline", "curve-editor"]
theme = []
anim = []
binding = []
color = []
number-field = []
inspector = ["number-field", "binding"]
layer-panel = []
# timeline/curve-editor 消费 lumina-video 的数据模型(2026-10 决策:允许的金字塔扩展边
# widgets→video,无环;docs/06 §2.1 图待同步)。基础编辑不需要它们。
timeline = ["dep:lumina-video"]
curve-editor = ["dep:lumina-video"]
node-graph = []

[dependencies]
lumina-core.workspace = true
lumina-canvas.workspace = true
lumina-video = { workspace = true, optional = true }
kurbo.workspace = true
peniko.workspace = true
thiserror.workspace = true
# widgets 是 GPUI 形态的组件层(分册三/四),gpui 是它的身份而非可选依赖;
# 真正的"零 gpui"场景请用 lumina-core / lumina-canvas(cpu-render)
# 分册四前提:按钮/输入框/虚拟列表等基础件直接用 gpui-component 现成品,本 crate 只做它没有的
gpui.workspace = true
gpui-component.workspace = true
