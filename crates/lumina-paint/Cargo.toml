[package]
name = "lumina-paint"
description = "L2 渲染层:画笔/渐变/描边原语、GPU 后端选择(auto/DX12/Vulkan)、GpuGuard 设备丢失恢复、vello_cpu 兜底"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpu"]
# GPU 路径:Vello(wgpu 经 vello::wgpu re-export,29.x;运行期 auto/DX12/Vulkan 可选,分册六 §6)
gpu = ["dep:vello"]
# CPU 兜底:无 GPU 环境/服务器渲染/渲染回归测试(分册六 §6.4 降级链第 4 级)
cpu = ["dep:vello_cpu"]
# 后端三选一(编译期偏好 + 运行期 LUMINA_GPU_BACKEND 覆盖,分册六 §6.3)
backend-vulkan = ["gpu"]
backend-dx12 = ["gpu"]
backend-auto = ["gpu"]

[dependencies]
lumina-core.workspace = true
kurbo.workspace = true
peniko.workspace = true
thiserror.workspace = true
tracing.workspace = true
vello = { workspace = true, optional = true }
vello_cpu = { workspace = true, optional = true }
