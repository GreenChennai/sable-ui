[package]
name = "lumina"
description = "Lumina UI 门面:按场景点菜的组合入口(完整套件/只要核心/服务器端 CPU 渲染…)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# feature 矩阵照搬分册六 §2.2,典型用法:
#   完整设计软件            lumina = "0.1"
#   CLI 只要命令系统        lumina = { default-features = false, features = ["core"] }
#   服务器 SVG→PNG(无 GPU) lumina = { default-features = false, features = ["core", "cpu-render"] }
#   小工具要画布不要视频     lumina = { default-features = false, features = ["canvas"] }
[features]
default = ["full"]
full = ["canvas", "widgets", "dock", "video"]
# —— 单点场景 ——
core = ["dep:lumina-core"]
canvas = ["core", "dep:lumina-canvas", "lumina-canvas/gpui", "lumina-canvas/png"]
widgets = ["canvas", "dep:lumina-widgets"]
dock = ["widgets", "dep:lumina-dock"]
video = ["canvas", "dep:lumina-video"]
# —— 渲染后端三选一(分册六 §6;运行期 LUMINA_GPU_BACKEND 可覆盖)——
backend-vulkan = ["lumina-paint/backend-vulkan"]
backend-dx12 = ["lumina-paint/backend-dx12"]
backend-auto = ["lumina-paint/backend-auto"]
# —— CPU 兜底(无 GPU 环境/服务器渲染)——
cpu-render = ["lumina-paint/cpu"]

[dependencies]
lumina-paint.workspace = true
lumina-core = { workspace = true, optional = true }
lumina-canvas = { workspace = true, optional = true }
lumina-widgets = { workspace = true, optional = true }
lumina-dock = { workspace = true, optional = true }
lumina-video = { workspace = true, optional = true }
