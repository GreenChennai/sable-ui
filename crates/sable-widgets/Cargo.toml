[package]
name = "sable-widgets"
description = "L5 专用组件层:设计 token、主题、动画引擎、NumberField/色轮/图层面板/属性检查器/时间轴视图"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 组件级 feature(分册六 §2.2/§2.3):小软件按需点菜,不想要的组件不进编译产物
[features]
default = ["full"]
full = ["theme", "anim", "binding", "color", "number-field", "inspector", "layer-panel", "timeline", "curve-editor", "controls"]
theme = []
anim = []
# 基础控件层(迭代审查报告 §5.6 批1,CMP-01):全部消费 tokens/state_layer/弹簧令牌
controls = ["theme", "anim"]
binding = []
# color(色轮/渐变编辑器)经工具行按钮消费 controls::button(CMP-11 收口)
color = ["controls"]
# number-field/layer-panel 接入 A7/A4 微交互(HoverState/FlipTracker 在 anim 引擎上),
# 故组件 feature 依赖 anim(与 inspector 依赖 number-field 同款特性依赖链)
number-field = ["anim"]
# inspector/effect_stack/gradient_editor 的工具行按钮消费 controls::button(CMP-11)
inspector = ["number-field", "binding", "controls"]
# layer-panel/layer_tree 工具行与行内重排按钮消费 controls::button(CMP-11)
layer-panel = ["anim", "dep:slotmap", "controls"]
# timeline/curve-editor 消费 sable-video 的数据模型(2026-10 决策:允许的金字塔扩展边
# widgets→video,无环;docs/06 §2.1 图待同步)。基础编辑不需要它们。
timeline = ["dep:sable-video"]
curve-editor = ["dep:sable-video"]

[dependencies]
sable-foundation.workspace = true
# Neon Card 对标组件的离屏自绘底座(CpuRenderer/render_shadow_rgba,cpu 默认
# feature):金字塔向下依赖(widgets → paint 与 video/widgets → canvas →
# paint → core 同向,workspace 内部 crate 而非外部依赖;story 效果页同款先例)
sable-paint.workspace = true
# CMP-09:层板缩略图经 canvas::render_node_thumbnail 离屏 + gpui_element
# rgba_to_render_image 单点上屏(png/gpui features 拉入 image/gpui 面)
sable-canvas = { workspace = true, features = ["png", "gpui"] }
sable-video = { workspace = true, optional = true }
# layer-panel 专用:NodeId(slotmap key)→ u64 作为 FlipTracker 的元素键(可选,
# 随 layer-panel feature 进出,不加重基础编辑场景的依赖面)
slotmap = { workspace = true, optional = true }
kurbo.workspace = true
peniko.workspace = true
thiserror.workspace = true
# widgets 是 GPUI 形态的组件层(分册三/四),gpui 是它的身份而非可选依赖;
# 真正的"零 gpui"场景请用 sable-foundation / sable-canvas(cpu-render)
# 注:曾有 gpui-component 依赖(旧"分册四前提:基础件直接用现成品"),因
# gpui-component 0.5.1 跑在 gpui-pre 类型世界与本 crate 的 gpui 0.2.2 不互通、
# 实际零使用(死依赖,COUP-08/CMP-01④),已删;基础控件自研于 src/controls/。
gpui.workspace = true
