[package]
name = "sable-foundation"
description = "L0 基础层:视口变换、场景图(纯数据)、命令系统(撤销重做)、原子写持久化——零 UI 框架依赖"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 分册六 §2.1:core 只许依赖 kurbo/serde/slotmap + 工程 crate,出现 gpui/egui/wgpu 依赖视为架构事故。
# peniko 原在白名单内,但 core 的类型设计(Paint 枚举)用不到,已移除——不为用而用。
[dependencies]
kurbo.workspace = true
slotmap.workspace = true
serde.workspace = true
# .sable 工程文件 MessagePack 编解码(分册五 §5.1;src/project.rs,serde 家族序列化面)
rmp-serde.workspace = true
usvg = { version = "0.48", optional = true }
thiserror.workspace = true
# RB-11:关键路径结构化日志(svg/project 长任务的 span 与耗时;非 UI 依赖,
# foundation 依赖金字塔不受影响)
tracing.workspace = true

[features]
# SVG 互通(docs/08 V2.0 T1):usvg 解析/自研序列化;默认关,门禁单测开启
svg = ["dep:usvg"]

[dev-dependencies]
usvg.workspace = true
proptest.workspace = true
# 分册六 §1.2 铁律验收:Scene 序列化→反序列化 == 原值
serde_json = "1"
# 分册六 §5.1 基准体系(criterion 微基准;CI 默认不执行 bench harness)
criterion = "0.5"

# 基准目标:命令执行(merge 开/undo/redo)、History 事务、Scene::add_node
[[bench]]
name = "cmd_bench"
harness = false

# 基准目标:.sable 工程存取(1 千节点 + 500 命令的 save/load)
[[bench]]
name = "project_bench"
harness = false
