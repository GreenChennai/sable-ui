[package]
name = "sable-canvas"
description = "L3 画布内核:场景图(slotmap)、无限画布、命中测试、网格、脏矩形、LOD、文本管线"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpu"]
gpu = ["sable-paint/gpu"]
cpu = ["sable-paint/cpu"]
# gpui Element 胶水(画布嵌入 Dock 面板;分册二 §4.2)
gpui = ["dep:gpui"]
# GPUI 上屏的裸帧构造(gpui 0.2.2 RenderImage::new 只吃 image crate 的
# animation::Frame;任务豁免项:image 以 optional 引入,无 PNG 编码步骤)
png = ["dep:image"]

[dependencies]
sable-foundation.workspace = true
sable-paint.workspace = true
kurbo.workspace = true
peniko.workspace = true
slotmap.workspace = true
serde.workspace = true
thiserror.workspace = true
parley.workspace = true
# Linux fontconfig dlopen 模式(图级统一;见根 Cargo.toml 注释)
fontique.workspace = true
# 字形轮廓(真文本渲染,V3.0 T1;与 parley 同源版本,单一拷贝)
skrifa.workspace = true
tracing.workspace = true
gpui = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true
proptest.workspace = true
# 分册六 §5.1 基准体系(criterion 微基准;CI 默认不执行 bench harness)
criterion = "0.5"

# 基准目标:1000 节点随机分布的点选命中(确定性 xorshift 伪随机,不引 rand)
[[bench]]
name = "hit_test_bench"
harness = false

# 基准目标:render_scene 200 形状 96×96 CpuRenderer(E12 Off 降级路径)
[[bench]]
name = "render_bench"
harness = false
