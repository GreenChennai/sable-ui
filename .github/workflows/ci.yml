name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 主门禁:Windows(目标平台)全量测试。
  # test 用单线程:reduced_motion 全局开关在并行测试下有竞态窗口
  # (flip/scroll/interact 的 reduced 用例会临时置位全局 AtomicBool)。
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GATE-09 CHANGELOG 门禁需要 HEAD~1(默认浅克隆深度 1 取不到)
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: sable-foundation 零 UI 依赖纪律(分册六 §2.4)
        run: cargo check -p sable-foundation --no-default-features
      # GATE-08 依赖红线:上游 ARL-1.0 禁抄码,vb_*/cutforge-* 节点不得进依赖图
      - name: 依赖红线(vb_*/cutforge-* 不得出现在依赖图,分册十二 G-5)
        shell: bash
        run: |
          cargo tree --workspace -e normal > "$RUNNER_TEMP/cargo_tree.txt"
          if grep -E "vb_|cutforge-" "$RUNNER_TEMP/cargo_tree.txt"; then
            echo "::error::依赖图出现红线节点(vb_*/cutforge-*):ARL-1.0/ACL-1.0 禁抄码纪律"
            exit 1
          fi
          echo "依赖图无 vb_*/cutforge-* 节点:通过"
      # GATE-09 CHANGELOG 纪律:crates/examples 变更必须同步 CHANGELOG(分册十二 G-7)
      - name: CHANGELOG 纪律(分册十二 G-7)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "非 push 事件(PR),跳过;以 push 进 main 的提交为校验对象"
            exit 0
          fi
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "取不到 HEAD~1(首次提交/浅克隆),跳过本次校验"
            exit 0
          fi
          # 先落变量再判空:GH bash 默认 -o pipefail,grep -q 提前关管道
          # 会让 git diff 吃 SIGPIPE 干扰判断,不用管道判定
          changed_src="$(git diff --name-only HEAD~1..HEAD -- crates/ examples/)"
          changed_log="$(git diff --name-only HEAD~1..HEAD -- CHANGELOG.md)"
          if [ -z "$changed_src" ]; then
            echo "本次提交未触及 crates/ 或 examples/,CHANGELOG 校验不适用"
            exit 0
          fi
          if [ -n "$changed_log" ]; then
            echo "CHANGELOG 纪律通过(触及 crates/examples 且已更新 CHANGELOG)"
          else
            echo "::error::本提交改了 crates/ 或 examples/ 但未更新 CHANGELOG.md(Unreleased 段)"
            echo "$changed_src"
            exit 1
          fi
      # COUP-10/RBT-09:reduced_motion 改 thread_local 后并行测试无竞态,
      # 解除 RUST_TEST_THREADS=1(2026-10-04 本机串行+并行双绿实测)。
      - name: test(并行;竞态已由 RBT-09 thread_local 根除)
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --release

  # Linux 编译检查:gpui Linux 后端需要系统库,只编译不跑窗口测试
  # (headless 窗口测试不可靠;行为验证由 Windows gate 承担)。
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 系统库(gpui Linux 编译 + fontique/fontconfig + pkg-config)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev libasound2-dev libfontconfig-dev libxkbcommon-dev libwayland-dev libgbm-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: check(全 feature)
        run: cargo check --workspace --all-features

  # 公共 API 快照(COUP-02):breaking 变更必须伴随快照更新并升 minor。
  # 门面 crate(sable)全 feature 面;nightly 是 cargo-public-api 的 rustdoc JSON 要求。
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: 快照 diff(docs/api-snapshot/sable.txt)
        run: |
          cargo public-api -p sable --all-features > docs/api-snapshot/sable.txt
          if ! git diff --exit-code docs/api-snapshot/sable.txt; then
            echo "::error::公共 API 变化未同步快照——更新 docs/api-snapshot/sable.txt 并按语义升版本"
            exit 1
          fi

  # MSRV 校验(DOC-07):声明的 rust-version = 1.85 必须真实可编译。
  # 采用 CI job 而非 rust-toolchain.toml 钉版——钉版会强制本机降版开发。
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: check(MSRV 1.85;仅 lib 面,dev-deps 不锁旧版)
        run: cargo check -j 2 --workspace --all-features --lib

  # feature 矩阵(07 报告 P1-1):防"默认路径绿、旁路路径烂"。
  # 纯 foundation 面测试(svg/fuzz 冒烟)不依赖 gpui,可在 ubuntu 直接跑;
  # usvg→fontdb→fontconfig 需要 libfontconfig-dev(实测踩坑)。
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 系统库(usvg→fontdb→fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPU 路径 check(backend-vulkan/dx12/auto 共用 gpu feature)
        run: cargo check -p sable-paint --features gpu
      - name: 全 feature check
        run: cargo check --workspace --all-features
      - name: 最小 feature(core-only 场景,分册六 §2.3)
        run: cargo check -p sable --no-default-features --features core
      - name: cpu-render 场景(服务器渲染)
        run: cargo check -p sable --no-default-features --features core,cpu-render
      - name: SVG 互通测试(V2.0 T1)
        run: "cargo test -p sable-foundation --features svg svg::"
      - name: 解析器模糊冒烟(proptest 随机输入永不 panic)
        run: cargo test -p sable-foundation --features svg prop_sv
      - name: wgpu 单版本对齐纪律(07 报告 P0-B;gpu feature 下才进依赖图)
        run: |
          N=$(cargo tree -p sable-paint --features gpu -i wgpu | grep -c "wgpu v")
          echo "wgpu 版本数: $N"
          [ "$N" = "1" ] || { cargo tree -p sable-paint --features gpu -i wgpu; exit 1; }

  # 许可自动审计(GATE-08,分册十二 G-6):独立 job,不阻塞现有三 job 的语义。
  # licenses 红线 = ARL-1.0 合规的机器可查形态;bans multiple-versions 仅告警。
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # 注意:arguments 里的空格会被整体引号成一个参数(check "licenses bans"
          # → unrecognized subcommand),子命令过滤必须连 command 一起写(README 口径)
          command: check licenses bans
