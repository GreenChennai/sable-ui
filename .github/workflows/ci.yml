name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: sable-foundation 零 UI 依赖纪律(分册六 §2.4)
        run: cargo check -p sable-foundation --no-default-features
      - name: test
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --release

  # feature 矩阵(07 报告 P1-1):防"默认路径绿、旁路路径烂"。
  # 教训:P0 的 GPU 死代码正是因为 CI 从未编译过 --features gpu。
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPU 路径(backend-vulkan/dx12/auto 共用 gpu feature)
        run: cargo check -p sable-paint --features gpu
      - name: 全 feature
        run: cargo check --workspace --all-features
      - name: 最小 feature(core-only 场景,分册六 §2.3)
        run: cargo check -p sable --no-default-features --features core
      - name: cpu-render 场景(服务器渲染)
        run: cargo check -p sable --no-default-features --features core,cpu-render
      - name: wgpu 单版本对齐纪律(07 报告 P0-B;gpu feature 下才进依赖图)
        run: |
          N=$(cargo tree -p sable-paint --features gpu -i wgpu | grep -c "wgpu v")
          echo "wgpu 版本数: $N"
          [ "$N" = "1" ] || { cargo tree -p sable-paint --features gpu -i wgpu; exit 1; }

  # ubuntu 上跑 gpui 窗口示例需要系统库;只编译不运行
  linux-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev libasound2-dev libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
