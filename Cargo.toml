[workspace]
resolver = "3"
members = [
    "crates/sable-foundation",
    "crates/sable-paint",
    "crates/sable-canvas",
    "crates/sable-widgets",
    "crates/sable-dock",
    "crates/sable-video",
    "crates/sable-script",
    "crates/sable",
    "examples/vector_editor",
    "examples/video_editor",
    "examples/story",
]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GreenChennai/sable-ui"
authors = ["GreenChennai"]

# 版本策略(2026-10 锁定):kurbo 0.13 / peniko 0.6 / parley 0.11 / vello 0.10 / gpui 0.2.2 / gpui-component 0.5.1
# 手册对应:docs/02(渲染/画布)、docs/03(框架层)、docs/04(组件)、docs/06(feature 矩阵)
# 升级走"升级窗口"单独分支(分册六 TD-01),不在日常迭代中顺手升级。

[profile.dev]
# 磁盘减脂(借鉴 VellumBench):dev 全量调试信息是 target 膨胀主力
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"

[workspace.dependencies]
# —— 内部 crate(依赖金字塔,严格单向:video/widgets → canvas → paint → core)——
sable-foundation    = { path = "crates/sable-foundation" }
sable-paint   = { path = "crates/sable-paint" }
sable-canvas  = { path = "crates/sable-canvas" }
sable-widgets = { path = "crates/sable-widgets" }
sable-dock    = { path = "crates/sable-dock" }
sable-video   = { path = "crates/sable-video" }

# —— L0 基础(零 UI 框架依赖;分册六 §2.1)——
kurbo   = { version = "0.13.1", features = ["serde"] }
peniko  = "0.6.1"
slotmap = { version = "1.1.1", features = ["serde"] }
serde   = { version = "1", features = ["derive"] }
thiserror = "2"

# —— L2 渲染(Linebender 栈)——
vello   = "0.10.0"
parley  = "0.11.1"
# CPU 兜底渲染(分册六 §6.4 降级链第 4 级;feature "cpu" 门控)
vello_cpu = "0.2.0"
# 字形轮廓读取(V3.0 T1 画布真文本):parley 自身同版本依赖(已在依赖树),
# 用于把 fontique 字体数据的 glyf/CFF 轮廓转成 kurbo::BezPath
skrifa = { version = "0.44.0", default-features = false }
# GPU 抽象(仅 sable-paint 的 "gpu" feature 引入,版本必须与 vello 对齐)
# 2026-10-02 S0 勘误(07 报告 P0-B):vello 0.10 锁 wgpu 29.0.3,workspace 必须对齐 29,
# 否则双 wgpu 共存 → vello::Renderer::new 类型不匹配。sable-paint 已改为直接使用
# vello::wgpu re-export(单一真相源);本条目保留给未来效果管线(E1)与潜在直接使用者。
wgpu  = "29"
image = "0.25"
# 工程文件序列化(.sable,分册五 §5.1:MessagePack + 版本号前向兼容)
rmp-serde = "1.3"
usvg = "0.48"

# —— 平台层(feature 门控,进 core/canvas/paint/video 者格杀勿论)——
gpui = "0.2.2"
# 0.5.1 是最后一个绑定 zed gpui ^0.2.2 的版本;0.6.0 起迁往 GPUI Kit 的 gpui-pre 0.3 线
# (独立类型世界,与 0.2.2 不可混用)。升级到 0.6+/0.7 = 全栈迁移决策,走"升级窗口"(TD-01/TD-02)
gpui-component = "0.5.1"

# —— 工程 ——
tracing = "0.1"
# fontique 的 Linux fontconfig backend 需 dlopen 模式以适配 yeslogic 6
# (usvg→fontdb 拉入 yeslogic 6.0.1 dlopen-only;不开则 fontique 链式 API
#  引用全部 unresolved——V3.0 CI 实测踩坑,docs/09)
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }

# —— 脚本(sable-script,迭代计划 09 T4/G16)——
# 1.26.1 = 2026-10 crates.io 最新。编译时长代价显著(全量编译 30s 级),
# 只进 sable-script、不进任何默认编译路径;feature 最小化:仅 default
# (std + ahash/runtime-rng),不开 serde/internals/decimal 等扩展面。
rhai = "1.26.1"

# —— dev ——
proptest = "1"
